<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convert — câmbio em tempo real</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:ital,wght@0,500;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="wordmark">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M4 12L10 6M4 12L10 18M4 12H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Convert
    </header>

    <main class="card">
      <div class="ticker" id="ticker" aria-live="polite">
        <div class="ticker__track" id="tickerTrack">
          <span class="ticker__item">carregando cotações…</span>
        </div>
      </div>

      <form id="converterForm">
        <div class="field">
          <label for="amount">Valor</label>
          <input
            type="text"
            inputmode="decimal"
            id="amount"
            name="amount"
            placeholder="0"
            autocomplete="off"
            required
          />
        </div>

        <div class="field">
          <label for="currency">Moeda de origem</label>
          <div class="select">
            <select id="currency" name="currency" required disabled>
              <option value="" disabled selected hidden>Carregando moedas…</option>
            </select>
          </div>
        </div>

        <button type="submit" id="submitButton" disabled>
          <span id="submitLabel">Buscando cotação</span>
        </button>

        <p class="form-status" id="formStatus"></p>
      </form>

      <section class="result" id="result">
        <span class="result__rate" id="rateLine"></span>
        <strong class="result__value" id="resultValue"></strong>
        <span class="result__timestamp" id="resultTimestamp"></span>
      </section>
    </main>

    <p class="footnote">
      Cotações via <a href="https://docs.awesomeapi.com.br/api-de-moedas" target="_blank" rel="noopener">AwesomeAPI</a>, atualizadas a cada minuto
    </p>

    <script src="scripts.js"></script>
  </body>
</html>
